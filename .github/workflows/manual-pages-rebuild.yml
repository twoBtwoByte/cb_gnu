name: Manual GitHub Pages Rebuild

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rebuild'
        required: false
        default: 'Manual trigger to reload updated configuration'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present
        env:
          VITE_FOOTBALL_DATA_API_TOKEN: ${{ secrets.VITE_FOOTBALL_DATA_API_TOKEN }}
  
      - name: Test
        run: npm test
  
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
  
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Log rebuild reason
        run: |
          echo "Pages rebuilt: ${{ inputs.reason }}"
