name: Update Match Results

on:
  schedule:
    # Runs every 2 hours, matching the client-side SCORE_REFRESH_INTERVAL_MS.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-until-deadline:
    runs-on: ubuntu-latest

    environment:
      name: update-results-json
      deployment: false
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: '24.x'

      # Compare current time to your end date (Format: YYYY-MM-DDThh:mm:ssZ)
      - name: Check Expiration Date
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          END_DATE="2026-07-22T23:59:59Z"
          
          if [ "$CURRENT_DATE" \> "$END_DATE" ]; then
            echo "The workflow end date has passed. Exiting."
            exit 1 # Fails or stops the workflow to prevent further actions
          fi

      - name: Fetch and write match results
        env:
          VITE_FOOTBALL_DATA_API_TOKEN: ${{ secrets.VITE_FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/fetchMatchResults.js

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/completedMatchResults.json
          if git diff --staged --quiet; then
            echo "No completed match result changes to commit."
          else
            git commit -m "chore: update completed match results"

            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                break
              fi

              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push updated results after 3 attempts."
                exit 1
              fi

              sleep $((attempt * 2))
              echo "Retrying push after syncing with origin/main (attempt $((attempt + 1))/3)..."
            done
          fi
