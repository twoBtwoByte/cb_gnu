name: Update Match Results

on:
  schedule:
    # Runs every 6 hours, matching the client-side SCORE_REFRESH_INTERVAL_MS.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Fetch and write match results
        env:
          VITE_FOOTBALL_DATA_API_TOKEN: ${{ secrets.VITE_FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/fetchMatchResults.js

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/completedMatchResults.json
          git diff --staged --quiet || git commit -m "chore: update completed match results"
          git push
