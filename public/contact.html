<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact & Suggestions</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        background: #f4f6fb;
        color: #1a1a2e;
      }
      main {
        max-width: 680px;
        margin: 3.5rem auto;
        padding: 0 1rem;
      }
      .card {
        background: #fff;
        border: 1px solid #e3e8f3;
        border-radius: 14px;
        padding: 1.5rem;
        box-shadow: 0 8px 24px rgba(28, 42, 74, 0.08);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 0.75rem;
      }
      p {
        line-height: 1.55;
        color: #2f3552;
      }
      .coming-soon {
        display: inline-block;
        margin-top: 0.6rem;
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        background: #fff3d5;
        color: #7a5600;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .back-link {
        display: inline-block;
        margin-top: 1rem;
        color: #2857c5;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact & Suggested Improvements</h1>
        <p>
          Thanks for visiting. I’d love to hear your ideas for improvements and
          feature suggestions for this site.
        </p>
        <p class="coming-soon">📬 Contact email link coming soon</p>
        <a class="back-link" href="/">← Back to the probability tracker</a>
      </section>
    </main>
  </body>
</html>
